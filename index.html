<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#4facfe">

<title>AI Translator Pro V5</title>

<link rel="stylesheet"
href="styles.css">

<!-- TESSERACT OCR -->
<script defer
src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<!-- MENU BUTTON -->
<div class="menu-btn"
onclick="toggleMenu()">
☰
</div>

<!-- SIDE MENU -->
<div class="side-menu"
id="sideMenu">

    <h3>Menu</h3>

    <button onclick="toggleTheme()">
        🌙 Dark Mode
    </button>

    <button onclick="showHistory()">
        📜 History
    </button>

    <button onclick="clearHistory()">
        🗑 Clear History
    </button>

    <div id="historyBox"></div>

</div>

<!-- OVERLAY -->
<div class="overlay"
id="overlay"
onclick="toggleMenu()"></div>

<!-- WELCOME -->
<div class="welcome"
id="welcomeScreen">

    <div class="welcome-box">

        <h1 class="typing-title">
            🤖 AI Translator
        </h1>

        <p>
            Translate instantly with AI power
        </p>

        <button class="start-btn"
        onclick="startApp()">
            🚀 Get Started
        </button>

    </div>

</div>

<!-- MAIN APP -->
<div class="main-app"
id="mainApp">

<div class="card">

    <h2 class="typing-title">
        🤖 AI Translator Pro V5
    </h2>

    <!-- MODE -->
    <div class="mode">

        <span>
            Smart AI Translation
        </span>

        <!-- CAMERA -->
        <button class="camera-btn"
        onclick="openCamera()">
            📷
        </button>

    </div>

    <!-- INPUT -->
    <div class="input-wrapper">

        <textarea
        id="inputText"
        class="chat-input"
        rows="1"
        placeholder="Type, speak or scan text..."></textarea>

        <!-- FILE MENU -->
        <button class="file-menu-btn"
        onclick="toggleFileMenu()">
            ⋮
        </button>

    </div>

    <!-- FILE POPUP -->
    <div class="file-popup"
    id="filePopup">

        <h4>Files</h4>

        <input
        type="file"
        id="fileInput"
        accept=".txt"
        onchange="loadFile(event)">

        <button onclick="toggleFileMenu()">
            Close
        </button>

    </div>

    <!-- FROM -->
    <select id="fromLang">

        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="te">Telugu</option>
        <option value="ta">Tamil</option>
        <option value="kn">Kannada</option>
        <option value="ml">Malayalam</option>

    </select>

    <!-- BUTTON ROW -->
    <div class="row">

        <button class="small-btn"
        onclick="swapLang()">
            🔁 Swap
        </button>

        <button class="small-btn"
        onclick="startVoice()">
            🎤 Voice
        </button>

    </div>

    <!-- OUTPUT -->
    <textarea
    id="outputText"
    class="chat-output"
    rows="1"
    placeholder="Translation..."
    readonly></textarea>

    <!-- TO -->
    <select id="toLang">

        <option value="te">Telugu</option>
        <option value="hi">Hindi</option>
        <option value="en">English</option>
        <option value="ta">Tamil</option>
        <option value="kn">Kannada</option>
        <option value="ml">Malayalam</option>

    </select>

    <!-- TRANSLATE -->
    <button class="btn"
    onclick="translateText()">
        Translate
    </button>

    <!-- SPEAK -->
    <button class="btn ai-btn"
    onclick="speakOutput()">
        🔊 Speak Output
    </button>

</div>

</div>

<!-- CAMERA MODAL -->
<div class="camera-modal"
id="cameraModal">

    <!-- VIDEO -->
    <video
    id="camera"
    autoplay
    muted
    playsinline></video>

    <!-- CANVAS -->
    <canvas
    id="captureCanvas"
    style="display:none;"></canvas>

    <!-- STATUS -->
    <div id="scanStatus">

        Waiting for camera...

    </div>

    <!-- BUTTONS -->
    <div class="camera-controls">

        <button
        id="scanBtn"
        onclick="captureImage()">

            📸 Click Me

        </button>

        <button
        onclick="closeCamera()">

            ❌ Close

        </button>

    </div>

</div>

<!-- SCRIPT -->
<script src="script.js"></script>

</body>
</html>
