<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Translator Pro V5</title>

<link rel="stylesheet" href="styles.css">

<!-- OCR LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<!-- MENU BUTTON -->
<div class="menu-btn" onclick="toggleMenu()">☰</div>

<!-- SIDE MENU -->
<div class="side-menu" id="sideMenu">

    <h3>Menu</h3>

    <button onclick="toggleTheme()">🌙 Dark Mode</button>
    <button onclick="showHistory()">📜 History</button>
    <button onclick="clearHistory()">🗑 Clear History</button>

    <div id="historyBox"></div>

</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- WELCOME SCREEN -->
<div class="welcome" id="welcomeScreen">

    <div class="welcome-box">

        <h1>🤖 AI Translator</h1>
        <p>Translate instantly with AI power</p>

        <button class="start-btn" onclick="startApp()">
            🚀 Get Started
        </button>

    </div>

</div>

<!-- MAIN APP -->
<div class="main-app" id="mainApp">

<div class="card">

    <h2>🤖 AI Translator Pro V5</h2>

    <!-- MODE -->
    <div class="mode">

        <span>Smart AI Translation</span>

        <button class="camera-btn" onclick="openCamera()">📷</button>

    </div>

    <!-- INPUT -->
    <div class="input-wrapper">

        <textarea id="inputText" class="chat-input"
        placeholder="Type, speak or scan text..."></textarea>

        <button class="file-menu-btn" onclick="toggleFileMenu()">⋮</button>

    </div>

    <!-- FILE MENU -->
    <div class="file-popup" id="filePopup">
        <input type="file" onchange="loadFile(event)">
        <button onclick="toggleFileMenu()">Close</button>
    </div>

    <!-- FROM LANGUAGE -->
    <select id="fromLang">
        <option value="auto">Auto Detect</option>
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="te">Telugu</option>
        <option value="ta">Tamil</option>
        <option value="kn">Kannada</option>
        <option value="ml">Malayalam</option>
    </select>

    <!-- BUTTON ROW -->
    <div class="row">

        <button class="small-btn" onclick="swapLang()">🔁 Swap</button>
        <button class="small-btn" onclick="startVoice()">🎤 Voice</button>

    </div>

    <!-- OUTPUT -->
    <textarea id="outputText" class="chat-output" readonly></textarea>

    <!-- TO LANGUAGE -->
    <select id="toLang">
        <option value="te">Telugu</option>
        <option value="hi">Hindi</option>
        <option value="en">English</option>
        <option value="ta">Tamil</option>
        <option value="kn">Kannada</option>
        <option value="ml">Malayalam</option>
    </select>

    <!-- TRANSLATE -->
    <button class="btn" onclick="translateText(false)">
        Translate
    </button>

    <!-- SPEAK OUTPUT (TOGGLED IN JS) -->
    <button class="btn ai-btn" onclick="toggleSpeak()">
        🔊 Speak Output
    </button>

</div>

</div>

<!-- CAMERA MODAL -->
<div class="camera-modal" id="cameraModal">

    <video id="camera" autoplay playsinline muted></video>

    <canvas id="captureCanvas" style="display:none;"></canvas>

    <div id="scanStatus">Waiting for camera...</div>

    <div class="camera-controls">

        <button id="scanBtn" onclick="captureImage()">
            📸 Click Me
        </button>

        <button onclick="closeCamera()">❌ Close</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
