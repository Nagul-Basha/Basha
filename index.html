<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Translator Pro V5</title>

<link rel="stylesheet" href="styles.css">

<!-- OCR LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<!-- MENU BUTTON -->
<div class="menu-btn" onclick="toggleMenu()">
☰
</div>

<!-- SIDE MENU -->
<div class="side-menu" id="sideMenu">

    <h3>Menu</h3>

    <button onclick="toggleTheme()">
        🌙 Dark Mode
    </button>

    <button onclick="showHistory()">
        📜 History
    </button>

    <button onclick="clearHistory()">
        🗑 Clear History
    </button>

    <div id="historyBox"></div>

</div>

<!-- OVERLAY -->
<div class="overlay"
id="overlay"
onclick="toggleMenu()"></div>

<!-- WELCOME SCREEN -->
<div class="welcome"
id="welcomeScreen">

    <div class="welcome-box">

        <h1 class="typing-title"
        id="title1">
            🤖 AI Translator
        </h1>

        <p>
            Translate instantly with AI power
        </p>

        <button class="start-btn"
        onclick="startApp()">
            🚀 Get Started
        </button>

    </div>

</div>

<!-- MAIN APP -->
<div class="main-app"
id="mainApp">

<div class="card"
style="
display:flex;
flex-direction:column;
gap:12px;
">

    <h2 class="typing-title"
    id="title2">
        🤖 AI Translator Pro V5
    </h2>

    <!-- MODE -->
    <div class="mode">

        <span>
            Mode: Basha Smart Google AI Engine 
        </span>

        <!-- CAMERA BUTTON -->
        <button class="camera-btn"
        onclick="openCamera()">
            📷
        </button>

    </div>

    <!-- INPUT -->
    <div class="input-wrapper">

        <textarea
        id="inputText"
        class="chat-input"
        rows="1"
        placeholder="Type or speak..."></textarea>

        <!-- FILE MENU -->
        <button class="file-menu-btn"
        onclick="toggleFileMenu()">
            ⋮
        </button>

    </div>

    <!-- FILE POPUP -->
    <div class="file-popup"
    id="filePopup">

        <h4>Files</h4>

        <input
        type="file"
        id="fileInput"
        accept=".txt"
        onchange="loadFile(event)">

        <div id="fileList"></div>

        <button onclick="toggleFileMenu()">
            Close
        </button>

    </div>

    <!-- FROM LANGUAGE -->
    <select id="fromLang">

        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="te">Telugu</option>
        <option value="ta">Tamil</option>
        <option value="kn">Kannada</option>
        <option value="ml">Malayalam</option>

    </select>

    <!-- BUTTON ROW -->
    <div class="row">

        <button class="small-btn"
        onclick="swapLang()">
            🔁 Swap
        </button>

        <button class="small-btn mic"
        onclick="startVoice()">
            🎤 Voice
        </button>

    </div>

    <!-- OUTPUT -->
    <textarea
    id="outputText"
    class="chat-output"
    rows="1"
    placeholder="Translation..."
    readonly></textarea>

    <!-- TO LANGUAGE -->
    <select id="toLang">

        <option value="te">Telugu</option>
        <option value="hi">Hindi</option>
        <option value="en">English</option>
        <option value="ta">Tamil</option>
        <option value="kn">Kannada</option>
        <option value="ml">Malayalam</option>

    </select>

    <!-- TRANSLATE -->
    <button class="btn"
    onclick="translateText()">
        Translate
    </button>

    <!-- SPEAK -->
    <button class="btn ai-btn"
    onclick="speakOutput()">
        🔊 Speak Output
    </button>

</div>

</div>

<!-- CAMERA MODAL -->
<div class="camera-modal"
id="cameraModal">

    <!-- LIVE CAMERA -->
    <video
    id="camera"
    autoplay
    playsinline
    muted></video>

    <!-- HIDDEN CANVAS -->
    <canvas
    id="captureCanvas"
    style="display:none;"></canvas>

    <!-- STATUS -->
    <div id="scanStatus"
    style="
    color:white;
    margin-top:12px;
    font-size:15px;
    text-align:center;
    ">
        Waiting for camera...
    </div>

    <!-- CAMERA BUTTONS -->
    <div style="
    display:flex;
    gap:10px;
    margin-top:15px;
    ">

        <button onclick="captureImage()">
            📸 Scan Text
        </button>

        <button onclick="closeCamera()">
            ❌ Close
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
